[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[project]
name = "mystorymaker"
version = "0.1.0"
description = "Sistema multiagente que escribe novelas manteniendo coherencia verificable"
requires-python = ">=3.12"
dependencies = ["alembic>=1.14"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "invariants: invariantes de dominio; se ejecutan siempre (CLAUDE.md §6)",
]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
