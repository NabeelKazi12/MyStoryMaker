# Configuracion de Alembic. El comando es el de CLAUDE.md 6: uv run alembic upgrade head
[alembic]
script_location = backend/migrations
prepend_sys_path = .
version_path_separator = os

# La URL real la resuelve env.py desde MYSTORYMAKER_DB, para no fijar una ruta aqui.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
