<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyStoryMaker · panel de control</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>MyStoryMaker</h1>
    <span class="subtitulo" id="subtitulo">cargando…</span>
    <div class="badges" id="badges"></div>
  </header>

  <main id="main">
    <div id="alertas"></div>

    <section class="tarjeta" id="tarjeta-brief">
      <h2>N0 · Brief del autor</h2>
      <div id="brief-cuerpo"></div>
    </section>

    <section class="tarjeta" id="tarjeta-escaleta">
      <h2>N1 y N2 · Investigación y escaleta</h2>
      <div id="escaleta-cuerpo"></div>
    </section>

    <section class="tarjeta" id="tarjeta-capitulos">
      <h2>Capítulos</h2>
      <div class="fila-entre" style="margin-bottom:0.7rem">
        <span class="tenue" id="capitulos-resumen"></span>
        <button id="btn-continuar">Continuar (hasta agotar pendientes o escalar)</button>
      </div>
      <div class="capitulos" id="capitulos-lista"></div>
    </section>

    <section class="tarjeta" id="tarjeta-manuscrito">
      <h2>N5 · Manuscrito final</h2>
      <div id="manuscrito-cuerpo"></div>
    </section>

    <section class="tarjeta" id="tarjeta-coste">
      <h2>Coste (Langfuse)</h2>
      <div id="coste-cuerpo">
        <button id="btn-coste" class="chico">Cargar resumen de coste</button>
      </div>
    </section>
  </main>

  <div class="panel-log" id="panel-log">
    <div class="cabecera" id="log-cabecera">
      <span class="punto" id="log-punto"></span>
      <strong id="log-titulo">Sin actividad</strong>
      <button class="chico" id="log-cancelar" hidden>Cancelar</button>
    </div>
    <div class="cuerpo mono" id="log-cuerpo"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
