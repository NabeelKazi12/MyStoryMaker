[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[project]
name = "mystorymaker"
version = "0.1.0"
description = "Sistema multiagente que escribe novelas manteniendo coherencia verificable"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "reportlab>=5.0.1",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "invariants: invariantes de dominio; se ejecutan siempre (CLAUDE.md §6)",
]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# reportlab no publica stubs. La frontera es estrecha: una funcion que recibe datos
# y escribe un fichero, cubierta por sus propios tests.
module = ["reportlab.*"]
ignore_missing_imports = true
